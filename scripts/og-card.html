<!doctype html>
<html lang="es-CO">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Geist:wght@500&display=swap" rel="stylesheet">
<style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#070809}
#c{display:block;width:1200px;height:630px}#f{position:absolute;left:-999px}
</style>
</head>
<body>
<canvas id="c" width="1200" height="630"></canvas>
<canvas id="f" width="64" height="64"></canvas>
<script>
const dots=[[6,5],[6,12],[6,20],[6,27],[13,5],[20,7],[25,12],[25,20],[20,25],[13,27]];
function logo(ctx,x,y,s){
  ctx.save();ctx.translate(x,y);ctx.scale(s,s);
  ctx.fillStyle='#EDEDEA';
  dots.forEach(([a,b])=>{ctx.beginPath();ctx.arc(a,b,2,0,7);ctx.fill()});
  ctx.fillStyle='#FFB000';ctx.beginPath();ctx.arc(15.5,16,3.6,0,7);ctx.fill();
  ctx.restore();
}
async function draw(){
  await document.fonts.load('160px Anton');
  await document.fonts.load('28px Geist');
  const c=document.getElementById('c'),x=c.getContext('2d');
  x.fillStyle='#070809';x.fillRect(0,0,1200,630);
  logo(x,88,72,2.4);
  x.fillStyle='#EDEDEA';x.font='400 92px Anton';x.textBaseline='top';
  x.fillText('SUS DATOS',88,210);
  x.fillStyle='#FFB000';x.fillText('YA SABEN',88,312);
  x.fillStyle='#EDEDEA';x.fillText('QUÉ PEDIR',88,414);
  x.fillStyle='#8E9196';x.font='500 28px Geist, sans-serif';
  x.fillText('daclu.online',88,548);
  const f=document.getElementById('f'),g=f.getContext('2d');
  g.fillStyle='#070809';g.fillRect(0,0,64,64);
  logo(g,8,8,1.5);
  document.body.dataset.ready='1';
  document.body.dataset.icon=f.toDataURL('image/png');
}
draw();
</script>
</body>
</html>
